name: Build & Package Suite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build NothingConfig App (Single File Executable)
      working-directory: src/Rainmeter/Skins/NothingTransparentSuite/@Resources/Config/App
      run: |
        dotnet restore
        dotnet publish -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../output

    - name: Deploy Compiled Executable into @Resources & Release
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "release" -Force
        Copy-Item -Path "src/Rainmeter/Skins/NothingTransparentSuite/@Resources/Config/output/NothingConfig.exe" -Destination "src/Rainmeter/Skins/NothingTransparentSuite/@Resources/Config/NothingConfig.exe" -Force
        Copy-Item -Path "src/Rainmeter/Skins/NothingTransparentSuite/@Resources/Config/output/NothingConfig.exe" -Destination "release/NothingConfig.exe" -Force

    - name: Assemble .rmskin Package
      shell: pwsh
      run: |
        $staging = "$env:RUNNER_TEMP/rmskin_staging"
        if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
        $skinDest = New-Item -ItemType Directory -Path "$staging/Skins/NothingTransparentSuite" -Force
        
        Copy-Item -Path "src/Rainmeter/Skins/NothingTransparentSuite/*" -Destination $skinDest -Recurse -Force
        Remove-Item "$skinDest/@Resources/Config/output" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item "$skinDest/@Resources/Config/App/bin" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item "$skinDest/@Resources/Config/App/obj" -Recurse -Force -ErrorAction SilentlyContinue
        
        $rmskinLines = @(
          "[rmskin]",
          "Name=NothingTransparentSuite",
          "Author=D1verlin",
          "Version=1.0.0",
          "Load=NothingTransparentSuite\Clock\Clock.ini",
          "MinimumRainmeter=4.5.0",
          "MinimumWindows=10.0"
        )
        $rmskinLines | Out-File -FilePath "$staging/RMSKIN.ini" -Encoding ascii
        
        New-Item -ItemType Directory -Path "release" -Force
        $rmskinFile = "release/NothingTransparentSuite-v1.0.0.rmskin"
        if (Test-Path $rmskinFile) { Remove-Item $rmskinFile -Force }
        
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $rmskinFile)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NothingTransparentSuite-v1.0.0
        path: |
          release/NothingTransparentSuite-v1.0.0.rmskin
          release/NothingConfig.exe

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Nothing Transparent Suite v1.0.0"
        body: |
          ### Nothing Transparent Suite v1.0.0
          Official unified Rainmeter desktop suite crafted in the authentic Nothing OS aesthetic.

          #### Downloads:
          - **`NothingTransparentSuite-v1.0.0.rmskin`**: Full Rainmeter suite (all 8 widgets, plugins, fonts, and configurator in one 1-click installer).
          - **`NothingConfig.exe`**: Standalone single-file configurator application.

          #### Highlights:
          - **8 Modular Direct2D Widgets**: Clock, System, Disks, Todo, Network, Player, Weather, Launcher.
          - **NothingConfig**: Native .NET 9 WPF configurator with Bento Grid layout and 1-click smart geolocation.
          - **Official Dot-Matrix Teardrop Icon**: Scalable vector aesthetic.
          - **Frosted Glass**: Windows Acrylic blur support and clean glass mode.
        files: |
          release/NothingTransparentSuite-v1.0.0.rmskin
          release/NothingConfig.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
