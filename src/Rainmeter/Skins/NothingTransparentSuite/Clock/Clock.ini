[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=132

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Clock
Author=D1verlin
Information=Monochrome transparent Nothing OS style clock widget with date and uptime. Click red dot for settings.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureTimeHM]
Measure=Time
Format=%H:%M

[MeasureTimeS]
Measure=Time
Format=:%S

[MeasureDate]
Measure=Time
Format=%A, %d %B
FormatLocale=local

[MeasureUptime]
Measure=Uptime
Format="%4!d!d %3!02d!h %2!02d!m"

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,132,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=TIME & DATE

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0
LeftMouseUpAction=["#@#Config\NothingConfig.exe"]
ToolTipText=Click to open Nothing Suite Configurator
MouseOverAction=[!SetOption MeterAccentDot Shape "Ellipse 0,0,5 | Fill Color #ColorAccent# | StrokeWidth 0"][!UpdateMeter MeterAccentDot][!Redraw]
MouseLeaveAction=[!SetOption MeterAccentDot Shape "Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0"][!UpdateMeter MeterAccentDot][!Redraw]

[MeterTimeHM]
Meter=String
MeterStyle=StyleValueBigNdot
MeasureName=MeasureTimeHM
X=#Padding#
Y=(#Padding# + 12)
FontSize=46

[MeterTimeS]
Meter=String
FontFace=#FontDotReg#
FontSize=14
FontColor=#ColorSecondary#
AntiAlias=1
MeasureName=MeasureTimeS
X=([MeterTimeHM:X] + [MeterTimeHM:W] + 4)
Y=(#Padding# + 20)
DynamicVariables=1

[MeterDate]
Meter=String
MeterStyle=StyleBodyInterBold
MeasureName=MeasureDate
X=#Padding#
Y=88
StringCase=Upper

[MeterUptime]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureUptime
X=#Padding#
Y=108
Text=UPTIME: %1
