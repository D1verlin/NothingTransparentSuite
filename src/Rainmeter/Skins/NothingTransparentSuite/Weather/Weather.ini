[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=155

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Weather
Author=D1verlin
Information=Monochrome transparent Nothing OS style weather widget using Open-Meteo.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureWeatherParent]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#WeatherLatitude#&longitude=#WeatherLongitude#&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m
RegExp=(?si)"current":\{.*?"temperature_2m":([-\d\.]+).*?"relative_humidity_2m":(\d+).*?"apparent_temperature":([-\d\.]+).*?"weather_code":(\d+).*?"wind_speed_10m":([-\d\.]+)
UpdateRate=900

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeatherParent]
StringIndex=1

[MeasureHumidity]
Measure=WebParser
URL=[MeasureWeatherParent]
StringIndex=2

[MeasureApparentTemp]
Measure=WebParser
URL=[MeasureWeatherParent]
StringIndex=3

[MeasureWeatherCode]
Measure=WebParser
URL=[MeasureWeatherParent]
StringIndex=4
Substitute="0":"CLEAR SKY","1":"MAINLY CLEAR","2":"PARTLY CLOUDY","3":"OVERCAST","45":"FOGGY","48":"RIME FOG","51":"LIGHT DRIZZLE","53":"DRIZZLE","55":"HEAVY DRIZZLE","61":"LIGHT RAIN","63":"RAIN","65":"HEAVY RAIN","71":"LIGHT SNOW","73":"SNOW","75":"HEAVY SNOW","80":"SHOWERS","81":"HEAVY SHOWERS","82":"VIOLENT SHOWERS","95":"THUNDERSTORM"

[MeasureWind]
Measure=WebParser
URL=[MeasureWeatherParent]
StringIndex=5

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,155,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=WEATHER · #WeatherCity#

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

; --- BIG TEMPERATURE ---

[MeterTemp]
Meter=String
MeterStyle=StyleValueBigNdot
MeasureName=MeasureTemp
X=#Padding#
Y=(#Padding# + 14)
FontSize=44
Text=%1°C

; --- CONDITIONS & DETAILS ---

[MeterCondition]
Meter=String
MeterStyle=StyleBodyInterBold
MeasureName=MeasureWeatherCode
X=#Padding#
Y=88
FontSize=11
StringCase=Upper

[MeterSubDetails]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureApparentTemp
MeasureName2=MeasureWind
MeasureName3=MeasureHumidity
X=#Padding#
Y=110
Text=FEELS: %1°C · WIND: %2 km/h · HUM: %3%

[MeterRefreshWeather]
Meter=String
MeterStyle=StyleSubTextInter
X=(#CardWidth# - #Padding#)
Y=132
StringAlign=Right
FontSize=8
FontColor=#ColorSecondary#
Text=UPDATE
ToolTipText=Refresh weather data
LeftMouseUpAction=[!CommandMeasure MeasureWeatherParent "Update"]
MouseOverAction=[!SetOption MeterRefreshWeather FontColor "#ColorPrimary#"][!UpdateMeter MeterRefreshWeather][!Redraw]
MouseLeaveAction=[!SetOption MeterRefreshWeather FontColor "#ColorSecondary#"][!UpdateMeter MeterRefreshWeather][!Redraw]
