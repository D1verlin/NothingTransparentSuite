[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=184

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Launcher
Author=D1verlin
Information=Monochrome transparent Nothing OS style quick launcher dock with reactive hover states.
Version=1.0.0
License=MIT

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,184,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=QUICK LAUNCH

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

; --- APP 1: BROWSER ---
[MeterApp1Bg]
Meter=Shape
X=14
Y=42
Shape=Rectangle 0,0,130,36,8 | Fill Color 255,255,255,8 | StrokeWidth 1 | Stroke Color #ColorBorder#
Shape2=Ellipse 14,18,2.5 | Fill Color #ColorSecondary# | StrokeWidth 0
LeftMouseUpAction=["#App1Path#"]
MouseOverAction=[!SetOption MeterApp1Bg Shape "Rectangle 0,0,130,36,8 | Fill Color 255,255,255,20 | StrokeWidth 1 | Stroke Color #ColorPrimary#"][!SetOption MeterApp1Bg Shape2 "Ellipse 14,18,2.5 | Fill Color #ColorAccent# | StrokeWidth 0"][!SetOption MeterApp1Text FontColor "#ColorPrimary#"][!UpdateMeterGroup App1][!Redraw]
MouseLeaveAction=[!SetOption MeterApp1Bg Shape "Rectangle 0,0,130,36,8 | Fill Color 255,255,255,8 | StrokeWidth 1 | Stroke Color #ColorBorder#"][!SetOption MeterApp1Bg Shape2 "Ellipse 14,18,2.5 | Fill Color #ColorSecondary# | StrokeWidth 0"][!SetOption MeterApp1Text FontColor "#ColorSecondary#"][!UpdateMeterGroup App1][!Redraw]
Group=App1

[MeterApp1Text]
Meter=String
FontFace=#FontDotReg#
FontSize=9.5
FontColor=#ColorSecondary#
AntiAlias=1
X=32
Y=52
Text=#App1Name#
Group=App1

