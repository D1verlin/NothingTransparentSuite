[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=162

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Disks
Author=D1verlin
Information=Monochrome transparent Nothing OS style disk storage and IO speed monitor.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureDisk1Free]
Measure=FreeDiskSpace
Drive=#Disk1#
UpdateDivider=5

[MeasureDisk1Used]
Measure=FreeDiskSpace
Drive=#Disk1#
InvertMeasure=1
UpdateDivider=5

[MeasureDisk1Total]
Measure=FreeDiskSpace
Drive=#Disk1#
Total=1
UpdateDivider=3600

[MeasureDisk1Percent]
Measure=Calc
Formula=MeasureDisk1Total > 0 ? (MeasureDisk1Used / MeasureDisk1Total) : 0

[MeasureDisk2Free]
Measure=FreeDiskSpace
Drive=#Disk2#
UpdateDivider=5

[MeasureDisk2Used]
Measure=FreeDiskSpace
Drive=#Disk2#
InvertMeasure=1
UpdateDivider=5

[MeasureDisk2Total]
Measure=FreeDiskSpace
Drive=#Disk2#
Total=1
UpdateDivider=3600

[MeasureDisk2Percent]
Measure=Calc
Formula=MeasureDisk2Total > 0 ? (MeasureDisk2Used / MeasureDisk2Total) : 0

[MeasureDiskReadSpeed]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=_Total

[MeasureDiskWriteSpeed]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=_Total

[MeasureDiskReadNum]
Measure=Calc
Formula=MeasureDiskReadSpeed

[MeasureDiskWriteNum]
Measure=Calc
Formula=MeasureDiskWriteSpeed

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,162,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=STORAGE & IO

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

; --- DISK 1 (C:) ---

[MeterDisk1Label]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureDisk1Free
X=#Padding#
Y=40
AutoScale=1
NumOfDecimals=1
Text=DRIVE #Disk1#  FREE: %1B

[MeterDisk1Value]
Meter=String
MeterStyle=StyleValueMidNdot
MeasureName=MeasureDisk1Used
Percentual=1
X=(#CardWidth# - #Padding#)
Y=33
StringAlign=Right
Text=%1%

[MeterDisk1Bar]
Meter=Shape
X=#Padding#
Y=60
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 5 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasureDisk1Percent]),0 | StrokeWidth 5 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1
LeftMouseUpAction=["#Disk1#\"]
ToolTipText=Click to open #Disk1# in Explorer

; --- DISK 2 (D:) ---

[MeterDisk2Label]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureDisk2Free
X=#Padding#
Y=76
AutoScale=1
NumOfDecimals=1
Text=DRIVE #Disk2#  FREE: %1B

[MeterDisk2Value]
Meter=String
MeterStyle=StyleValueMidNdot
MeasureName=MeasureDisk2Used
Percentual=1
X=(#CardWidth# - #Padding#)
Y=69
StringAlign=Right
Text=%1%

[MeterDisk2Bar]
Meter=Shape
X=#Padding#
Y=96
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 5 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasureDisk2Percent]),0 | StrokeWidth 5 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1
LeftMouseUpAction=["#Disk2#\"]
ToolTipText=Click to open #Disk2# in Explorer

; --- DISK IO SPEED ---

[MeterIOLabel]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=116
FontSize=10
Text=ACTIVITY

[MeterReadSpeed]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureDiskReadNum
X=#Padding#
Y=136
AutoScale=1
NumOfDecimals=1
Text=READ: %1B/s

[MeterWriteSpeed]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureDiskWriteNum
X=(#CardWidth# - #Padding#)
Y=136
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text=WRITE: %1B/s
