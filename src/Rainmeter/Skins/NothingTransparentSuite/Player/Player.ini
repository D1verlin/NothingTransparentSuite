[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=172

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Player
Author=D1verlin
Information=Monochrome transparent Nothing OS style media player widget supporting Web/Spotify and vector buttons.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES (WebNowPlaying)
; ===================================================================

[MeasurePlayerTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
DefaultValue="No Web Media Playing"
Substitute="":"No Web Media Playing"

[MeasurePlayerArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
DefaultValue="YouTube / Spotify / Browser"
Substitute="":"YouTube / Spotify / Browser"

[MeasurePlayerAlbum]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Album

[MeasurePlayerCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=#@#UserData\nocover.png

[MeasurePlayerDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration
DefaultValue="00:00"

[MeasurePlayerPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
DefaultValue="00:00"

[MeasurePlayerProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress

[MeasurePlayerProgressPercent]
Measure=Calc
Formula=Clamp(MeasurePlayerProgress, 0, 100) / 100

[MeasurePlayerState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,172,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=MEDIA PLAYER

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

; --- ALBUM COVER ---

[MeterCoverPlaceholder]
Meter=Shape
X=#Padding#
Y=40
Shape=Rectangle 0,0,50,50,8 | Fill Color 255,255,255,10 | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterCover]
Meter=Image
MeasureName=MeasurePlayerCover
X=#Padding#
Y=40
W=50
H=50
PreserveAspectRatio=1

; --- TRACK INFO ---

[MeterTitle]
Meter=String
FontFace=#FontDotBold#
FontSize=11.5
FontColor=#ColorPrimary#
AntiAlias=1
ClipString=1
MeasureName=MeasurePlayerTitle
X=(#Padding# + 60)
Y=40
W=(#CardWidth# - #Padding#*2 - 60)
ToolTipText=[MeasurePlayerTitle]

[MeterArtist]
Meter=String
MeterStyle=StyleSubTextInter
FontSize=9.5
ClipString=1
MeasureName=MeasurePlayerArtist
X=(#Padding# + 60)
Y=58
W=(#CardWidth# - #Padding#*2 - 60)
ToolTipText=[MeasurePlayerArtist]

[MeterTimeProgress]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasurePlayerPosition
MeasureName2=MeasurePlayerDuration
FontSize=8
FontColor=#ColorSecondary#
X=(#Padding# + 60)
Y=75
Text=%1 / %2

; --- DOTTED PROGRESS BAR ---

[MeterProgressBar]
Meter=Shape
X=#Padding#
Y=104
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 4 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasurePlayerProgressPercent]),0 | StrokeWidth 4 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasurePlayerTitle "SetPosition $MouseX:%$"]

; --- GEOMETRIC VECTOR CONTROLS ---

; Previous Button
[MeterBtnPrev]
Meter=Shape
X=(#CardWidth# / 2 - 46)
Y=126
Shape=Path PrevPath | Fill Color #ColorSecondary# | StrokeWidth 0
PrevPath=0,2 | LineTo 0,14 | LineTo 2.5,14 | LineTo 2.5,8 | LineTo 12,14 | LineTo 12,2 | LineTo 2.5,8 | LineTo 2.5,2 | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasurePlayerTitle "Previous"]
MouseOverAction=[!SetOption MeterBtnPrev Shape "Path PrevPath | Fill Color #ColorPrimary# | StrokeWidth 0"][!UpdateMeter MeterBtnPrev][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnPrev Shape "Path PrevPath | Fill Color #ColorSecondary# | StrokeWidth 0"][!UpdateMeter MeterBtnPrev][!Redraw]
ToolTipText=Previous track

; Play / Pause Button
[MeterBtnPlayPause]
Meter=Shape
X=(#CardWidth# / 2 - 7)
Y=124
Shape=Path PlayPath | Fill Color #ColorPrimary# | StrokeWidth 0
PlayPath=0,1 | LineTo 14,9 | LineTo 0,17 | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasurePlayerTitle "PlayPause"]
MouseOverAction=[!SetOption MeterBtnPlayPause Shape "Path PlayPath | Fill Color #ColorAccent# | StrokeWidth 0"][!UpdateMeter MeterBtnPlayPause][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnPlayPause Shape "Path PlayPath | Fill Color #ColorPrimary# | StrokeWidth 0"][!UpdateMeter MeterBtnPlayPause][!Redraw]
ToolTipText=Play / Pause

; Next Button
[MeterBtnNext]
Meter=Shape
X=(#CardWidth# / 2 + 36)
Y=126
Shape=Path NextPath | Fill Color #ColorSecondary# | StrokeWidth 0
NextPath=0,2 | LineTo 9.5,8 | LineTo 9.5,2 | LineTo 12,2 | LineTo 12,14 | LineTo 9.5,14 | LineTo 9.5,8 | LineTo 0,14 | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasurePlayerTitle "Next"]
MouseOverAction=[!SetOption MeterBtnNext Shape "Path NextPath | Fill Color #ColorPrimary# | StrokeWidth 0"][!UpdateMeter MeterBtnNext][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnNext Shape "Path NextPath | Fill Color #ColorSecondary# | StrokeWidth 0"][!UpdateMeter MeterBtnNext][!Redraw]
ToolTipText=Next track
