[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=162

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing System
Author=D1verlin
Information=Monochrome transparent Nothing OS style system resource monitor (CPU, RAM, GPU, Temp).
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureCPUPercent]
Measure=Calc
Formula=Clamp(MeasureCPU, 0, 100) / 100

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=3600

[MeasureRAMPercent]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? Clamp((MeasureRAM / MeasureRAMTotal), 0, 1) : 0

[MeasureGPU]
Measure=Plugin
Plugin=UsageMonitor
Category=GPU Engine
Counter=Utilization Percentage
Index=0

[MeasureGPUCalc]
Measure=Calc
Formula=Round(MeasureGPU)

[MeasureGPUPercent]
Measure=Calc
Formula=Clamp(MeasureGPU, 0, 100) / 100

[MeasureGPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw0
Substitute="":"--"

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,162,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=SYSTEM MONITOR

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

; --- CPU SECTION ---

[MeterCPULabel]
Meter=String
MeterStyle=StyleSubTextInter
X=#Padding#
Y=40
Text=CPU LOAD

[MeterCPUValue]
Meter=String
MeterStyle=StyleValueMidNdot
MeasureName=MeasureCPU
X=(#CardWidth# - #Padding#)
Y=33
StringAlign=Right
Text=%1%

[MeterCPUBar]
Meter=Shape
X=#Padding#
Y=60
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 5 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasureCPUPercent]),0 | StrokeWidth 5 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1

; --- RAM SECTION ---

[MeterRAMLabel]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureRAM
X=#Padding#
Y=76
AutoScale=1
NumOfDecimals=1
Text=RAM USED: %1B

[MeterRAMValue]
Meter=String
MeterStyle=StyleValueMidNdot
MeasureName=MeasureRAM
Percentual=1
X=(#CardWidth# - #Padding#)
Y=69
StringAlign=Right
Text=%1%

[MeterRAMBar]
Meter=Shape
X=#Padding#
Y=96
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 5 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasureRAMPercent]),0 | StrokeWidth 5 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1

; --- GPU SECTION ---

[MeterGPULabel]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureGPUTemp
X=#Padding#
Y=112
Text=GPU ENGINE  TEMP: %1°C

[MeterGPUValue]
Meter=String
MeterStyle=StyleValueMidNdot
MeasureName=MeasureGPUCalc
X=(#CardWidth# - #Padding#)
Y=105
StringAlign=Right
Text=%1%

[MeterGPUBar]
Meter=Shape
X=#Padding#
Y=132
Shape=Line 0,0,(#CardWidth# - #Padding#*2),0 | StrokeWidth 5 | Stroke Color #ColorMuted# | StrokeDashes 1,1.5
Shape2=Line 0,0,((#CardWidth# - #Padding#*2) * [MeasureGPUPercent]),0 | StrokeWidth 5 | Stroke Color #ColorPrimary# | StrokeDashes 1,1.5
DynamicVariables=1
