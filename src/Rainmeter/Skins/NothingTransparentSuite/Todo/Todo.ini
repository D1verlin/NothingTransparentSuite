[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=252

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Todo
Author=D1verlin
Information=Monochrome transparent Nothing OS style interactive task list with Lua backend.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureTodoLua]
Measure=Script
ScriptFile=#@#Scripts\Todo.lua
UpdateDivider=1

[MeasureInputText]
Measure=Plugin
Plugin=InputText
X=#Padding#
Y=42
W=(#CardWidth# - #Padding#*2)
H=22
FontFace=#FontUI#
FontSize=10
FontColor=#ColorPrimary#
SolidColor=25,25,25,245
AntiAlias=1
FocusDismiss=1
Command1=[!CommandMeasure MeasureTodoLua "AddTask('$UserInput$')"]

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,252,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterTodoHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=TASKS
Group=TodoGroup

[MeterBtnAdd]
Meter=String
FontFace=#FontDotBold#
FontSize=14
FontColor=#ColorPrimary#
AntiAlias=1
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# - 3)
StringAlign=Right
Text=[+]
ToolTipText=Click to add a new task
LeftMouseUpAction=[!PluginBang "MeasureInputText ExecuteBatch 1"]

; --- TASK ITEM 1 ---
[MeterTaskCheck1]
Meter=String
FontFace=#FontDotReg#
FontSize=10
FontColor=#ColorSecondary#
AntiAlias=1
X=#Padding#
Y=46
Text=[ ]
Group=TodoGroup
LeftMouseUpAction=[!CommandMeasure MeasureTodoLua "ToggleTask(1)"]

[MeterTaskText1]
Meter=String
MeterStyle=StyleBodyInter
X=(#Padding# + 26)
Y=46
W=(#CardWidth# - #Padding#*2 - 44)
Text=Task 1
Group=TodoGroup
LeftMouseUpAction=[!CommandMeasure MeasureTodoLua "ToggleTask(1)"]
ToolTipText=Left click: toggle · Right click: delete
RightMouseUpAction=[!CommandMeasure MeasureTodoLua "DeleteTask(1)"]

[MeterTaskDel1]
Meter=String
FontFace=#FontUI#
FontSize=11
FontColor=#ColorMuted#
AntiAlias=1
X=(#CardWidth# - #Padding#)
Y=45
StringAlign=Right
Text=×
Group=TodoGroup
ToolTipText=Delete task
LeftMouseUpAction=[!CommandMeasure MeasureTodoLua "DeleteTask(1)"]
MouseOverAction=[!SetOption MeterTaskDel1 FontColor "#ColorAccent#"][!UpdateMeter MeterTaskDel1][!Redraw]
MouseLeaveAction=[!SetOption MeterTaskDel1 FontColor "#ColorMuted#"][!UpdateMeter MeterTaskDel1][!Redraw]

