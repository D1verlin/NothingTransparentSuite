[MeterClearCompleted]
Meter=String
MeterStyle=StyleSubTextInter
X=#Padding#
Y=220
FontSize=8
FontColor=#ColorSecondary#
Text=CLEAR COMPLETED
ToolTipText=Remove all finished tasks
LeftMouseUpAction=[!CommandMeasure MeasureTodoLua "ClearCompleted()"]
MouseOverAction=[!SetOption MeterClearCompleted FontColor "#ColorPrimary#"][!UpdateMeter MeterClearCompleted][!Redraw]
MouseLeaveAction=[!SetOption MeterClearCompleted FontColor "#ColorSecondary#"][!UpdateMeter MeterClearCompleted][!Redraw]

[MeterReloadTasks]
