MeterStyle=StyleSubTextInter
X=(#CardWidth# - #Padding#)
Y=220
StringAlign=Right
FontSize=8
FontColor=#ColorSecondary#
Text=RELOAD
ToolTipText=Reload from disk
LeftMouseUpAction=[!CommandMeasure MeasureTodoLua "ReadTasks()"]
