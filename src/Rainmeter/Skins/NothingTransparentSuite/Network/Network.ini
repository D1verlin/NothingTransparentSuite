[Rainmeter]
Update=1000
UseD2D=1
AccurateText=1
SkinWidth=#CardWidth#
SkinHeight=195

@IncludeVars=#@#Include\Variables.inc
@IncludeStyles=#@#Include\Styles.inc

[Metadata]
Name=Nothing Network
Author=D1verlin
Information=Monochrome transparent Nothing OS style network traffic monitor and graph.
Version=1.0.0
License=MIT

; ===================================================================
; MEASURES
; ===================================================================

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=30

[MeasureNetInTotal]
Measure=NetIn
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Cumulative=1

; ===================================================================
; METERS
; ===================================================================

[MeterCardBg]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,195,#CornerRadius# | Fill Color #ColorGlassBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeader]
Meter=String
MeterStyle=StyleHeaderNdot
X=#Padding#
Y=#Padding#
Text=NETWORK TRAFFIC

[MeterAccentDot]
Meter=Shape
X=(#CardWidth# - #Padding# - 4)
Y=(#Padding# + 5)
Shape=Ellipse 0,0,3.5 | Fill Color #ColorAccent# | StrokeWidth 0

[MeterIP]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureIP
X=#Padding#
Y=38
Text=LOCAL IP: %1

; --- SPEED VALUES ---

[MeterDL]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureNetIn
X=#Padding#
Y=58
AutoScale=1
NumOfDecimals=1
Text=↓ DL: %1B/s

[MeterUL]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureNetOut
X=(#CardWidth# - #Padding#)
Y=58
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text=↑ UL: %1B/s

; --- NETWORK ACTIVITY GRAPH ---

[MeterGraphContainer]
Meter=Shape
X=#Padding#
Y=80
Shape=Rectangle 0,0,(#CardWidth# - #Padding#*2),50,6 | Fill Color 255,255,255,10 | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterNetGraph]
Meter=Line
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=(#Padding# + 1)
Y=81
W=(#CardWidth# - #Padding#*2 - 2)
H=48
LineColor=#ColorPrimary#
LineColor2=#ColorSecondary#
LineWidth=1.5
SolidColor=0,0,0,0
AntiAlias=1

; --- TOTALS FOOTER ---

[MeterTotals]
Meter=String
MeterStyle=StyleSubTextInter
MeasureName=MeasureNetInTotal
MeasureName2=MeasureNetOutTotal
X=#Padding#
Y=146
AutoScale=1
NumOfDecimals=1
FontSize=8
FontColor=#ColorSecondary#
Text=TOTAL: ↓ %1B   ↑ %2B

[MeterResetStats]
Meter=String
MeterStyle=StyleSubTextInter
X=(#CardWidth# - #Padding#)
Y=168
StringAlign=Right
FontSize=8
FontColor=#ColorSecondary#
Text=RESET STATS
LeftMouseUpAction=[!ResetStats]
MouseOverAction=[!SetOption MeterResetStats FontColor "#ColorPrimary#"][!UpdateMeter MeterResetStats][!Redraw]
MouseLeaveAction=[!SetOption MeterResetStats FontColor "#ColorSecondary#"][!UpdateMeter MeterResetStats][!Redraw]
